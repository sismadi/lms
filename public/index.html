    <!-- [KEAMANAN] Content-Security-Policy sebagai lapis pertahanan
         TAMBAHAN (bukan pengganti) escHtml()/sanitizeInput() di
         script.js — kalau ada payload yang lolos, CSP ini mencegahnya
         memuat script dari domain lain atau menjalankan inline
         event-handler yang disuntikkan lewat innerHTML. connect-src
         mengizinkan panggilan ke lms-api (origin sendiri (satu Worker));
         sesuaikan kalau origin API berubah. Referensi pola: cms-app (piawai).
         Catatan: gembok kuis & form drawer di app ini memang memakai
         inline onclick/onsubmit bawaan (bukan hasil suntikan pengguna),
         jadi 'unsafe-inline' TETAP diberikan pada script-src supaya
         fitur yang sudah ada tidak patah — CSP di sini fokus membatasi
         asal script & koneksi jaringan, lapis utama tetap escHtml(). -->
    <meta http-equiv="Content-Security-Policy" content="
        default-src 'self';
        script-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com https://static.cloudflareinsights.com;
        style-src 'self' 'unsafe-inline';
        img-src 'self' https: data:;
        connect-src 'self' https://cdnjs.cloudflare.com;
        frame-src https:;
        object-src 'none';
        base-uri 'self';
    ">

<script type="text/javascript">

// Menu dibangun langsung dari siteConfig (didefinisikan di dataset.js).
// Tidak ada lagi daftar menu terpisah di sini — urutan & label menu
// cukup diatur di satu tempat (siteConfig), lihat komentar di dataset.js.
function renderMenu() {
    const navLinks = document.getElementById('navLinks');
    if (!navLinks) return;

    // `role` dan `guestOnly` (opsional, lihat dataset.js) menyaring menu
    // sesuai status login & peran — admin ikut melihat menu ber-`role`.
    const user = (typeof auth !== 'undefined') ? auth.currentUser() : null;

    navLinks.innerHTML = siteConfig
        .filter(p => p.menu)
        .filter(p => !p.guestOnly || !user)
        .filter(p => !p.role || (user && (user.role === p.role || user.role === 'admin')))
        .map(p => `<a href="?${p.slug}" onclick="event.preventDefault(); web.navigate('${p.slug}')">${p.label}</a>`)
        .join('\n');

    if (typeof auth !== 'undefined') auth.renderAuthUI();
}

</script>
